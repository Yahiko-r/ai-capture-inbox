<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Capture Inbox</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="profile">
          <div>
            <h1>Capture Inbox</h1>
            <p id="providerLabel">Loading</p>
            <p id="providerError" class="provider-error"></p>
          </div>
        </div>

        <section class="composer">
          <div class="composer-tabs">
            <button class="composer-tab active" type="button" data-capture-mode="text">Text</button>
            <button class="composer-tab" type="button" data-capture-mode="url">Web</button>
            <button class="composer-tab" type="button" data-capture-mode="file">Image</button>
          </div>

          <form id="textCaptureForm" class="capture-form active">
            <textarea id="textCaptureInput" rows="4" placeholder="Write a note"></textarea>
            <button class="primary-button" type="submit">Create note</button>
          </form>

          <form id="urlCaptureForm" class="capture-form">
            <input id="urlCaptureInput" type="url" placeholder="https://example.com">
            <button class="primary-button" type="submit">Analyze web</button>
          </form>

          <form id="fileCaptureForm" class="capture-form">
            <input id="fileCaptureInput" type="file" accept="image/*,.txt,.md,.json,.html,.csv">
            <button class="primary-button" type="submit">Analyze image</button>
          </form>
        </section>

        <div class="search-container">
          <input id="searchInput" class="search-input" type="search" placeholder="Search notes, todos, big notes">
        </div>

        <nav class="nav-groups" aria-label="Workspace">
          <section class="nav-group">
            <div class="nav-heading">
              <span>Notes</span>
              <strong id="statNotes">0</strong>
            </div>
            <div id="noteList" class="nav-list"></div>
          </section>

          <section class="nav-group">
            <button id="todoNavButton" class="nav-row" type="button">
              <span>TODO</span>
              <strong id="statTasks">0</strong>
            </button>
          </section>

          <section class="nav-group">
            <div class="nav-heading">
              <span>Big Notes</span>
              <button id="newBigNoteButton" class="tiny-button" type="button" title="New big note">+</button>
            </div>
            <div id="bigNoteList" class="nav-list"></div>
          </section>
        </nav>

        <div class="sidebar-footer">
          <button id="refreshButton" class="icon-button" type="button" title="Refresh" aria-label="Refresh">↻</button>
          <button id="settingsButton" class="icon-button" type="button" title="Settings" aria-label="Settings">⚙️</button>
          <div id="statusLine" class="status-line">Ready</div>
        </div>
      </aside>

      <div class="resize-handle" id="resizeHandle"></div>

      <main class="workspace">
        <section id="mainPanel" class="main-panel"></section>
      </main>
    </div>

    <template id="emptyTemplate">
      <div class="empty-state">
        <h3>No items</h3>
      </div>
    </template>

    <template id="settingsTemplate">
      <div class="settings-view">
        <div class="settings-sidebar">
          <h2>Settings</h2>
          <nav class="settings-nav">
            <button class="settings-nav-item active" data-section="llm">AI Provider</button>
          </nav>
        </div>
        <div class="settings-content">
          <section id="llmSettings" class="settings-section active">
            <h3>AI Provider Configuration</h3>
            <form id="llmSettingsForm">
              <div class="form-group">
                <label for="llmProvider">Provider</label>
                <select id="llmProvider" required>
                  <option value="">-- Select Provider --</option>
                  <option value="deepseek">DeepSeek</option>
                  <option value="openai">OpenAI</option>
                </select>
              </div>

              <div class="form-group">
                <label for="llmApiKey">API Key</label>
                <input id="llmApiKey" type="password" placeholder="sk-..." required>
              </div>

              <div class="form-group">
                <label for="llmBaseUrl">Base URL (Optional)</label>
                <input id="llmBaseUrl" type="text" placeholder="Leave empty for default">
              </div>

              <div class="form-group">
                <label for="llmModel">Model (Optional)</label>
                <input id="llmModel" type="text" placeholder="Leave empty for default">
              </div>

              <div class="form-actions">
                <button type="button" id="testConnectionBtn" class="secondary-button">Test Connection</button>
                <button type="submit" class="primary-button">Save Settings</button>
              </div>

              <div id="connectionStatus" class="connection-status"></div>
            </form>
          </section>
        </div>
      </div>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
