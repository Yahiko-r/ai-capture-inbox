<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Capture Inbox</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="profile">
          <div class="avatar">AI</div>
          <div>
            <h1>Capture Inbox</h1>
            <p id="providerLabel">Loading</p>
          </div>
        </div>

        <section class="composer">
          <div class="composer-tabs">
            <button class="composer-tab active" type="button" data-capture-mode="text">Text</button>
            <button class="composer-tab" type="button" data-capture-mode="url">Web</button>
            <button class="composer-tab" type="button" data-capture-mode="file">Image</button>
          </div>

          <form id="textCaptureForm" class="capture-form active">
            <textarea id="textCaptureInput" rows="4" placeholder="Write a note"></textarea>
            <button class="primary-button" type="submit">Create note</button>
          </form>

          <form id="urlCaptureForm" class="capture-form">
            <input id="urlCaptureInput" type="url" placeholder="https://example.com">
            <button class="primary-button" type="submit">Analyze web</button>
          </form>

          <form id="fileCaptureForm" class="capture-form">
            <input id="fileCaptureInput" type="file" accept="image/*,.txt,.md,.json,.html,.csv">
            <button class="primary-button" type="submit">Analyze image</button>
          </form>
        </section>

        <nav class="nav-groups" aria-label="Workspace">
          <section class="nav-group">
            <div class="nav-heading">
              <span>Notes</span>
              <strong id="statNotes">0</strong>
            </div>
            <div id="noteList" class="nav-list"></div>
          </section>

          <section class="nav-group">
            <button id="todoNavButton" class="nav-row" type="button">
              <span>TODO</span>
              <strong id="statTasks">0</strong>
            </button>
          </section>

          <section class="nav-group">
            <div class="nav-heading">
              <span>Big Notes</span>
              <button id="newBigNoteButton" class="tiny-button" type="button" title="New big note">+</button>
            </div>
            <div id="bigNoteList" class="nav-list"></div>
          </section>
        </nav>

        <div class="sidebar-footer">
          <button id="refreshButton" class="icon-button" type="button" title="Refresh" aria-label="Refresh">↻</button>
          <div id="statusLine" class="status-line">Ready</div>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <input id="searchInput" class="search-input" type="search" placeholder="Search notes, todos, big notes">
        </header>
        <section id="mainPanel" class="main-panel"></section>
      </main>
    </div>

    <template id="emptyTemplate">
      <div class="empty-state">
        <h3>No items</h3>
      </div>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
